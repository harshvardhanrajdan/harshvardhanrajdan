name: Top-Langs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate top-langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_top_langs.py top-langs.svg
      - name: Generate activity-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: harshvardhanrajdan
        run: python3 scripts/generate_activity_graph.py activity-graph.svg
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add top-langs.svg activity-graph.svg
          if git commit -m "chore: update profile svgs"; then
            git push
          fi
